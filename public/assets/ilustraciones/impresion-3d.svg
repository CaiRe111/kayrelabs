<style>
@media (prefers-reduced-motion: no-preference) {
.cab { animation: cab 3.2s ease-in-out infinite alternate; }
@keyframes cab { from { transform: translateX(-62px); } to { transform: translateX(62px); } }
.capa { animation: capa 2.4s ease-in-out infinite; animation-delay: var(--d); }
@keyframes capa { 0%,100% { stroke: #fff; stroke-opacity: .22; } 12% { stroke: #00C853; stroke-opacity: 1; } 30% { stroke: #fff; stroke-opacity: .22; } }
.top { animation: top 1.2s ease-in-out infinite alternate; }
@keyframes top { from { stroke-opacity: .5; } to { stroke-opacity: 1; } }
.rell { stroke-dasharray: 6 5; animation: rell 1.1s linear infinite; }
@keyframes rell { to { stroke-dashoffset: -11; } }
.gota { transform-box: fill-box; transform-origin: center; animation: gota .8s ease-in-out infinite; }
@keyframes gota { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.9); opacity: .55; } }
}
</style>
