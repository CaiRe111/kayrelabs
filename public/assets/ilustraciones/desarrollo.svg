<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" fill="none" stroke-linecap="round" stroke-linejoin="round">
<style>
@media (prefers-reduced-motion: no-preference) {
.tec { transform-box: fill-box; transform-origin: left center; animation: tec 7s ease-out infinite backwards; animation-delay: var(--d); }
@keyframes tec { 0% { transform: scaleX(0); opacity: 1; } 7% { transform: scaleX(1); } 88% { transform: scaleX(1); opacity: 1; } 96%,100% { transform: scaleX(1); opacity: 0; } }
.cursor { animation: parp 1s steps(2) infinite; }
@keyframes parp { 50% { opacity: 0; } }
.badge { transform-box: fill-box; transform-origin: center; animation: badge 2.6s ease-in-out infinite alternate; }
@keyframes badge { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.09) rotate(3deg); } }
.punto { animation: punto 1.6s ease-in-out infinite; }
@keyframes punto { 50% { opacity: .25; } }
.vent { animation: vent 5s ease-in-out infinite alternate; }
@keyframes vent { from { transform: translate(0,0); } to { transform: translate(8px,-6px); } }
.term { animation: term 3s ease-in-out infinite; }
@keyframes term { 0%,100% { stroke-opacity: .8; } 50% { stroke-opacity: .25; } }
}
</style>
