<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440" fill="none" stroke-linecap="round" stroke-linejoin="round">
<!-- Inicio: las dos ramas de KayreLabs conectadas — software (panel y tarjeta NFC en el celular) y producto físico (pieza impresa en 3D con chip NFC) -->
<style>
@media (prefers-reduced-motion: no-preference) {
.barra { transform-box: fill-box; transform-origin: center bottom; animation: crecer 6s ease-out infinite backwards; animation-delay: var(--d); }
@keyframes crecer { 0% { transform: scaleY(0); } 12% { transform: scaleY(1); } 90% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
.flujo { stroke-dasharray: 6 10; animation: flujo 1.6s linear infinite; }
@keyframes flujo { to { stroke-dashoffset: -32; } }
.onda { animation: onda 2.4s ease-in-out infinite; animation-delay: var(--d); }
@keyframes onda { 0%, 100% { stroke-opacity: .15; } 40% { stroke-opacity: .95; } }
.flota { animation: flota 4s ease-in-out infinite alternate; }
@keyframes flota { to { transform: translateY(-8px); } }
.sello { animation: sello 6s ease-out infinite; animation-delay: var(--d); }
@keyframes sello { 0%, 30% { fill-opacity: 0; } 36%, 92% { fill-opacity: 1; } 100% { fill-opacity: 0; } }
}
</style>

