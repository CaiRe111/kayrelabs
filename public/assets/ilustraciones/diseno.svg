<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" width="480" height="420" fill="none" stroke-linecap="round" stroke-linejoin="round">
<style>
@media (prefers-reduced-motion: no-preference) {
.dibuja { stroke-dasharray: 100; stroke-dashoffset: 100; animation: dibuja 5s ease-in-out infinite; }
@keyframes dibuja { 0% { stroke-dashoffset: 100; opacity: 1; } 55% { stroke-dashoffset: 0; opacity: 1; } 85% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
.hormigas { animation: horm .7s linear infinite; }
@keyframes horm { to { stroke-dashoffset: -10; } }
.logoK { animation: horm2 2.4s linear infinite; }
@keyframes horm2 { to { stroke-dashoffset: -9.5; } }
.hoja { animation: hoja 2.2s ease-in-out infinite alternate; }
@keyframes hoja { from { fill-opacity: .1; } to { fill-opacity: .7; } }
.tirador { animation: tir 1.8s ease-in-out infinite; animation-delay: var(--d); }
@keyframes tir { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
.cursor { animation: cur 5s ease-in-out infinite; }
@keyframes cur { 0%,100% { transform: translate(0,0); } 35% { transform: translate(-58px,-44px); } 60% { transform: translate(-58px,-44px); } 85% { transform: translate(20px,10px); } }
.mues { transform-box: fill-box; transform-origin: center; animation: mues 2.4s ease-in-out infinite; animation-delay: var(--d); }
@keyframes mues { 0%,100% { transform: translateY(0) scale(1); } 40% { transform: translateY(-9px) scale(1.12); } }
.ancla { transform-box: fill-box; transform-origin: center; animation: ancla 2.5s ease-in-out infinite; animation-delay: var(--d); }
@keyframes ancla { 0%,100% { transform: scale(1); } 50% { transform: scale(1.45); } }
.pill { animation: pill 5s ease-in-out infinite; }
@keyframes pill { 0%,100% { transform: translate(0,0); } 35%,60% { transform: translate(-58px,-44px); } 85% { transform: translate(20px,10px); } }
}
</style>
