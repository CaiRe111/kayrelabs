<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="ui-monospace,Consolas,monospace">
  <rect width="800" height="500" fill="#06141a"/>
  <rect x="30" y="30" width="740" height="440" rx="10" fill="#0b2029" stroke="#2fd6c4" stroke-opacity=".45"/>
  <!-- barra lateral -->
  <rect x="30" y="30" width="170" height="440" rx="10" fill="#08181f"/>
  <text x="50" y="68" fill="#2fd6c4" font-size="15" font-weight="bold">Garantías</text>
  <g fill="#ffffff" fill-opacity=".55" font-size="12">
    <text x="50" y="112">▸ Panel</text>
    <text x="50" y="142" fill="#2fd6c4" fill-opacity="1">▸ Trámites</text>
    <text x="50" y="172">▸ Fletes</text>
    <text x="50" y="202">▸ Relaciones</text>
    <text x="50" y="232">▸ Facturas</text>
    <text x="50" y="262">▸ Admin</text>
  </g>
  <!-- indicadores -->
  <g>
    <rect x="224" y="56" width="162" height="70" rx="6" fill="#0f2c37" stroke="#2fd6c4" stroke-opacity=".3"/>
    <text x="240" y="82" fill="#fff" fill-opacity=".6" font-size="11">Casos abiertos</text>
    <text x="240" y="112" fill="#2fd6c4" font-size="26" font-weight="bold">24</text>
    <rect x="400" y="56" width="162" height="70" rx="6" fill="#0f2c37" stroke="#2fd6c4" stroke-opacity=".3"/>
    <text x="416" y="82" fill="#fff" fill-opacity=".6" font-size="11">Mi bandeja</text>
    <text x="416" y="112" fill="#2fd6c4" font-size="26" font-weight="bold">7</text>
    <rect x="576" y="56" width="170" height="70" rx="6" fill="#0f2c37" stroke="#ff4d8d" stroke-opacity=".6"/>
    <text x="592" y="82" fill="#fff" fill-opacity=".6" font-size="11">Fletes sin abrir</text>
    <text x="592" y="112" fill="#ff4d8d" font-size="26" font-weight="bold">3</text>
  </g>
  <!-- flujo de estados -->
  <text x="224" y="166" fill="#fff" fill-opacity=".7" font-size="12">Línea de estados</text>
  <line x1="240" y1="196" x2="730" y2="196" stroke="#2fd6c4" stroke-opacity=".35" stroke-width="2"/>
  <g fill="#2fd6c4">
    <circle cx="240" cy="196" r="7"/><circle cx="340" cy="196" r="7"/><circle cx="440" cy="196" r="7"/>
  </g>
  <circle cx="540" cy="196" r="7" fill="#06141a" stroke="#2fd6c4" stroke-width="2"/>
  <circle cx="640" cy="196" r="7" fill="#06141a" stroke="#2fd6c4" stroke-opacity=".4" stroke-width="2"/>
  <circle cx="730" cy="196" r="7" fill="#06141a" stroke="#2fd6c4" stroke-opacity=".4" stroke-width="2"/>
  <g fill="#fff" fill-opacity=".55" font-size="10" text-anchor="middle">
    <text x="240" y="220">Ingreso</text><text x="340" y="220">Envío</text><text x="440" y="220">Conciliado</text>
    <text x="540" y="220">Técnico</text><text x="640" y="220">Bodega</text><text x="730" y="220">Cerrado</text>
  </g>
  <!-- tabla -->
  <g fill="#0f2c37">
    <rect x="224" y="254" width="522" height="34" rx="4"/>
    <rect x="224" y="298" width="522" height="34" rx="4"/>
    <rect x="224" y="342" width="522" height="34" rx="4"/>
    <rect x="224" y="386" width="522" height="34" rx="4"/>
  </g>
  <g fill="#2fd6c4" font-size="12">
    <text x="240" y="276">G21-001</text><text x="240" y="320">G21-002</text>
    <text x="240" y="364">G34-003</text><text x="240" y="408">R12-004</text>
  </g>
  <g fill="#ffffff" fill-opacity=".6" font-size="12">
